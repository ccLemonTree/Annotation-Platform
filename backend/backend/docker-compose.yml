services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: data_platform_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: data_platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI应用
  backend:
    build: .
    container_name: data_platform_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - image_data:/app/data
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: data_platform
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      DEFAULT_TENANT_ID: "1"
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data
      UPLOAD_DIR: /app/uploads
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  image_data:
  uploads:
